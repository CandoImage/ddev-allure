name: allure

# One Allure server shared by all DDEV projects. The services run as their own
# compose project (ddev-allure) on the ddev_default network, so they are
# independent of any project's start / stop.
project_files:
  - commands/host/allure
  - allure/docker-compose.yaml

ddev_version_constraint: '>= v1.24.0'

post_install_actions:
  - |
    #ddev-description: Usage hint
    echo "Run 'ddev allure start' to start the shared Allure server."

removal_actions:
  - |
    #ddev-description: Leave the shared server alone
    echo "The shared Allure server keeps running for other projects: 'ddev allure stop' / 'ddev allure purge'."
